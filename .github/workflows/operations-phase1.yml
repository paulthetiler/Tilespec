name: TileSPEC operations acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Local PostgreSQL prerequisites
        run: |
          if ! find /usr/lib/postgresql -path '*/bin/initdb' -print -quit 2>/dev/null | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client
          fi
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:forms
