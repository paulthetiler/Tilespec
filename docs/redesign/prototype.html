<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TileSPEC — proposed daily workflow (review only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f2a3a;
    --teal: #326e67;
    --teal-dark: #245c55;
    --paper: #f4f7f8;
    --line: #d7e2e5;
    --muted: #536b77;
    --card: #fff;
    --warn-bg: #fff9ec;
    --warn: #80500b;
    --stop: #9b3527;
    --stop-bg: #fff6f3;
    --ok: #1f6b45;
    --ok-bg: #eef7f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #e7eef0; color: var(--ink); font-family: "DM Sans", Arial, sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .review { flex: none; z-index: 5; background: var(--ink); color: #fff; padding: 14px 16px 12px; }
  .review p { margin: 0 0 8px; font-size: 13px; line-height: 1.4; color: #d5e4e8; max-width: 78ch; }
  .review strong { color: #fff; }
  .controls { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; overflow-x: auto; }
  .controls button, .controls select { min-height: 40px; border-radius: 8px; border: 1px solid #3d6270; background: transparent; color: #fff; padding: 0 12px; }
  .controls button[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
  .controls select { background: var(--ink); }
  .saved { display: none; margin-top: 10px; }
  .saved.open { display: block; }
  .saved summary { cursor: pointer; font-size: 13px; color: #d5e4e8; }
  .saved fieldset { border: 1px solid #2c4a58; margin: 8px 0 0; }
  .saved legend { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #b7cdd4; }
  .saved label { display: inline-flex; align-items: center; gap: 6px; margin: 6px 14px 0 0; font-size: 13px; min-height: 32px; }
  .stage { flex: 1; min-height: 0; padding: 12px 0; display: flex; justify-content: center; }
  .device { width: 390px; max-width: 100%; flex: none; height: 100%; max-height: 760px; background: var(--paper); border: 1px solid #c5d4d8; display: flex; flex-direction: column; overflow: hidden; }
  .device.desktop { width: min(1080px, 100%); height: 100%; max-height: 860px; display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .device.desktop .top { grid-column: 1 / -1; }
  .brand { display: flex; align-items: center; min-height: 44px; }
  .brand img { width: min(168px, 46vw); height: auto; }
  .who { text-align: right; font-size: 13px; max-width: 46%; overflow-wrap: anywhere; }
  .who strong { display: block; }
  .who span { color: var(--muted); }
  .side { display: none; }
  .device.desktop .side { display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: #fff; border-right: 1px solid var(--line); }
  .side button, .tabbar button { border: 0; background: transparent; text-align: left; min-height: 48px; padding: 8px 12px; border-radius: 8px; font-weight: 700; }
  .side button[aria-current="page"], .tabbar button[aria-current="page"] { background: #e7f3f1; color: var(--teal-dark); }
  .main { padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; overflow: auto; flex: 1; min-height: 0; }
  .device.desktop .main { padding: 28px 36px 40px; max-width: 760px; }
  .back { align-self: flex-start; border: 0; background: transparent; color: var(--teal-dark); font-weight: 700; min-height: 44px; padding: 0; }
  .kicker { margin: 0; font-size: 13px; color: var(--muted); }
  h1 { margin: 0; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -.01em; text-transform: uppercase; overflow-wrap: anywhere; }
  h2 { margin: 8px 0 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .device.desktop h1 { font-size: 40px; }
  .lead { margin: 0; font-size: 16px; line-height: 1.45; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0; }
  .next { display: grid; gap: 8px; }
  .primary, .quiet { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 64px; padding: 14px 16px; border-radius: 12px; font-size: 17px; font-weight: 800; text-align: center; line-height: 1.25; white-space: normal; }
  .primary { background: var(--teal); color: #fff; border: 2px solid var(--teal-dark); }
  .primary:hover { background: var(--teal-dark); }
  .quiet { background: #fff; color: var(--ink); border: 1px solid var(--ink); min-height: 52px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .quiet, .row .stop { width: auto; flex: 1; }
  .list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .item, .note, .choice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; }
  .item, .choice { width: 100%; display: grid; gap: 6px; justify-items: start; }
  .choice { min-height: 72px; }
  .choice strong, .item strong, dd { font-size: 16px; overflow-wrap: anywhere; }
  .choice span, .item span { color: var(--muted); font-size: 13px; }
  .tag { display: inline-flex; align-items: center; width: fit-content; min-height: 22px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
  .tag.gate { background: var(--stop-bg); color: var(--stop); }
  .tag.remind { background: var(--warn-bg); color: var(--warn); }
  .tag.wait { background: #eef3f5; color: #35515c; }
  .tag.saved { background: var(--ok-bg); color: var(--ok); }
  .tag.pending { background: var(--warn-bg); color: var(--warn); }
  .tag.blocked { background: var(--stop-bg); color: var(--stop); }
  .banner { padding: 14px; border-radius: 12px; background: var(--stop-bg); border: 1px solid #e5b7ad; }
  .banner strong { display: block; margin-bottom: 4px; }
  .banner p { margin: 0; font-size: 14px; }
  .checks { display: grid; gap: 14px; }
  .group h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .q { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .q p { margin: 0; font-weight: 700; }
  .yn { display: flex; gap: 8px; }
  .yn button { flex: 1; min-height: 48px; border-radius: 8px; border: 1px solid #aabdc5; background: #fff; font-weight: 800; }
  .yn button[aria-pressed="true"] { background: #d5eee5; outline: 2px solid var(--teal); }
  .field { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
  .field input, .field select, .field textarea { font-weight: 500; min-height: 48px; border: 1px solid #aabdc5; border-radius: 8px; padding: 10px 12px; background: #fff; }
  .field textarea { min-height: 88px; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: #fff; flex: none; }
  .device.desktop .tabbar { display: none; }
  .tabbar button { text-align: center; font-size: 12px; border-radius: 0; }
  .fine { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; }
  .textlink { border: 0; background: transparent; color: var(--teal-dark); font-weight: 700; min-height: 44px; padding: 0; text-decoration: underline; text-align: left; }
  .alert { padding: 14px; border-radius: 12px; background: var(--stop-bg); border: 1px solid #e5b7ad; }
  .alert strong { display: block; margin-bottom: 4px; }
  .alert p { margin: 0; }
  .split { display: grid; gap: 8px; }
  .device.desktop .split.two { grid-template-columns: 1fr 1fr; }
  dl { margin: 0; display: grid; gap: 10px; }
  dt { font-size: 12px; color: var(--muted); }
  dd { margin: 0; font-size: 16px; }
</style>
</head>
<body>
<header class="review">
  <p><strong>Review only.</strong> The phone frame is 390px wide. Sample records drive every list. Saving here updates that sample, not the live database. Safety stops and other gates stay above the remaining work.</p>
  <div class="controls">
    <button type="button" data-role="owner">Owner</button>
    <button type="button" data-role="office">Office</button>
    <button type="button" data-role="supervisor" aria-pressed="true">Supervisor</button>
    <button type="button" data-role="sub">Subcontractor</button>
    <button type="button" data-device="phone" aria-pressed="true">Phone 390</button>
    <button type="button" data-device="desktop">Desktop</button>
    <label>Situation <select id="scenario" aria-label="Saved situation">
      <option value="several">Several things open</option>
      <option value="long">Long job name</option>
      <option value="empty">Nothing outstanding</option>
      <option value="missing">Records missing</option>
      <option value="error">Save failed</option>
    </select></label>
    <label>Screen <select id="jump" aria-label="Jump to a screen"></select></label>
  </div>
  <details class="saved" id="saved">
    <summary>Saved records that feed the one supervisor rule list</summary>
    <fieldset>
      <label><input type="checkbox" data-flag="safety"> Safety stop active</label>
      <label><input type="checkbox" data-flag="release"> Restart requested</label>
      <label><input type="checkbox" data-flag="qualityHold"> Quality hold active</label>
      <label><input type="checkbox" data-flag="failedMandatory"> Failed required check</label>
      <label><input type="checkbox" data-flag="critical"> Serious snag</label>
      <label><input type="checkbox" data-flag="reinspect"> Repair waiting to be checked</label>
      <label><input type="checkbox" data-flag="disputed"> Responsibility disputed</label>
      <label><input type="checkbox" data-flag="overdue"> Repair overdue</label>
      <label><input type="checkbox" data-flag="checks"> Morning checks saved</label>
      <label><input type="checkbox" data-flag="unconfirmed"> People not confirmed</label>
      <label><input type="checkbox" data-flag="qaWaiting"> Inspection request waiting</label>
      <label><input type="checkbox" data-flag="ackWaiting"> Instruction waiting for acknowledgement</label>
      <label><input type="checkbox" data-flag="inspectionsDue"> Required inspection still due</label>
    </fieldset>
  </details>
</header>
<div class="stage"><div class="device" id="device"></div></div>
<script>
const logo = "../../public/tilespec-logo-animated.svg";
const state = { role: "supervisor", device: "phone", screen: "today", answers: {}, failedFrom: "today" };
const world = {};
const nav = {
  owner: [["today", "Today"], ["jobs", "Jobs"], ["money", "Money"], ["people", "People"]],
  office: [["today", "Today"], ["jobs", "Jobs"], ["labour", "Labour"], ["money", "Money"]],
  supervisor: [["today", "Today"], ["checks", "Checks"], ["people", "People"], ["snags", "Snags"]],
  sub: [["today", "Today"], ["snag", "My snag"], ["papers", "Papers"], ["update", "Update"]],
};
const titles = {
  today: "Today", jobs: "Jobs", job: "Job", money: "Money", people: "People", hold: "Stopped work",
  confirm: "Confirm a person", labour: "Labour", ask: "Send to site", request: "Inspection request",
  instruction: "Instruction", checks: "Morning checks", snags: "Snags", finish: "Finish today",
  stop: "Stop affected work", inspect: "Inspect", newsnag: "New snag", failed: "Not saved",
  snag: "Your repair", papers: "Papers", update: "Update", dispute: "Not our repair", drawing: "Drawing",
};
function jobName() {
  return world.scenario === "long"
    ? "Riverside Retail and Leisure Park, Unit 4 West Mall — Northbank Developments Phase 2 Shop Floor Porcelain"
    : "Riverside Retail";
}
function loadScenario(name) {
  const open = name === "several" || name === "long" || name === "error";
  const empty = name === "empty";
  Object.assign(world, {
    scenario: name,
    safety: false, release: false, qualityHold: false, failedMandatory: false,
    critical: open, reinspect: false, disputed: false, overdue: false, checks: true, earlier: false, unconfirmed: open,
    openSnags: open, inspectionsDue: false, locations: empty || name === "missing" ? 3 : 0,
    provisional: open, insuranceDays: open ? 12 : 90, enquiry: open, belowMargin: !empty,
    messagesAvailable: name !== "missing", restrictionsAvailable: name !== "missing",
    bookingAvailable: name !== "missing", planToday: !empty, hasPackage: !empty, drawing: !empty,
    snagAssigned: open, snagSubmitted: false, jobFromEnquiry: false,
    qa: open ? { title: "Check the first bay", location: "Shop floor", stage: "Tile installation", sentAt: "08:10", submittedAt: null, hasIssues: null } : null,
    instruction: open ? { title: "Grout delivery", body: "20 bags are coming this afternoon. Keep the entrance clear.", ackRequired: true, sentAt: "07:55", acknowledgedAt: null } : null,
    handover: empty || name === "missing" ? null : { at: "Yesterday, 17:10", actor: "Supervisor", work: "First bay laid.", problems: "Grout is short.", materials: "20 bags for tomorrow.", areas: "Entrance lippage." },
  });
  state.screen = "today";
  state.answers = {};
  syncFlags();
}
function syncFlags() {
  const values = {
    safety: world.safety, release: world.release, qualityHold: world.qualityHold, failedMandatory: world.failedMandatory,
    critical: world.critical, reinspect: world.reinspect, disputed: world.disputed, overdue: world.overdue, checks: world.checks, unconfirmed: world.unconfirmed,
    inspectionsDue: world.inspectionsDue, qaWaiting: !!(world.qa && !world.qa.submittedAt),
    ackWaiting: !!(world.instruction && world.instruction.ackRequired && !world.instruction.acknowledgedAt),
  };
  document.querySelectorAll("[data-flag]").forEach(input => { input.checked = !!values[input.getAttribute("data-flag")]; });
  const scenario = document.getElementById("scenario");
  if (scenario && world.scenario) scenario.value = world.scenario;
}
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null) node.setAttribute(key, value);
  }
  for (const child of children || []) if (child) node.append(child);
  return node;
}
function txt(tag, className, text) { return el(tag, { class: className, text }); }
function go(screen) { return () => { state.screen = screen; draw(); }; }
function commit(mutator, from) {
  if (world.scenario === "error") { state.failedFrom = from; state.screen = "failed"; draw(); return; }
  mutator();
  syncFlags();
  state.screen = "today";
  draw();
}
function tag(kind) {
  const map = { Blocked: "blocked", Pending: "pending", Saved: "saved", Waiting: "wait", Gate: "gate" };
  return el("span", { class: "tag " + (map[kind] || "pending"), text: kind });
}
function button(className, label, action) { return el("button", { class: className, type: "button", onclick: action, text: label }); }
function field(label, control) { return el("label", { class: "field" }, [el("span", { text: label }), control]); }

function supervisorQueue() {
  const job = jobName();
  const rules = [
    () => world.restrictionsAvailable && world.safety ? item("safety", true, "Blocked", "hold", "Review stopped work", "Shop floor tiling is stopped. Morning checks and a handover do not restart it.", "Supervisor keeps it stopped. An authorised office user releases it on the existing hold.", "A release saved on that hold.") : null,
    () => world.restrictionsAvailable && world.release ? item("release", true, "Blocked", "hold", "Review the request to restart", "A repair has been sent for a decision. Opening it does not restart the work.", "The office user allowed to release.", "The existing release decision, with a note.") : null,
    () => world.restrictionsAvailable && world.qualityHold ? item("quality", true, "Blocked", "hold", "Review the quality hold", "Tiling at the shop floor stays held until an authorised release.", "Supervisor keeps it stopped. Office releases it.", "A release saved on that hold.") : null,
    () => world.failedMandatory ? item("failed", true, "Blocked", "checks", "Review the failed check", "A required inspection failed. The affected work stays blocked.", "Supervisor", "A later saved inspection that meets the requirement.") : null,
    () => world.critical ? item("critical", false, "Pending", "snags", "Review the serious snag", "A serious snag needs the office. It does not stop work until a stop is recorded.", "Office reviews it. Supervisor raised it.", "The snag review on the existing snag, or a hold if work must stop.") : null,
    () => world.reinspect ? item("reinspect", true, "Blocked", "snags", "Check the repair", "Photos of a repair are saved. They are not an acceptance.", "Supervisor", "A new inspection that accepts or rejects the repair.") : null,
    () => world.disputed ? item("disputed", false, "Pending", "snags", "Review who owns the repair", "Someone has disputed responsibility. The office reviews it on the snag.", "Office", "Responsibility confirmed, or marked unable to determine, on that snag.") : null,
    () => world.overdue ? item("overdue", false, "Pending", "snags", "Review the overdue repair", "The target date has passed. The snag is still open.", "Supervisor, then the assigned gang", "A new target date, or the snag closed through the existing reinspection.") : null,
    () => !world.checks ? item("checks", false, "Pending", "checks", "Start morning checks", "No morning check is saved for this site today.", "Supervisor", "Today’s morning check saved.") : null,
    () => world.earlier ? item("earlier", true, "Blocked", "people", "Finish yesterday’s times", "Earlier work is still open.", "Supervisor", "An end time on those open periods.") : null,
    () => world.unconfirmed ? item("people", false, "Pending", "people", "Who is here?", "The booked gang is not confirmed yet.", "Supervisor", "Each booked gang confirmed, marked absent, or recorded as a change.") : null,
    () => world.messagesAvailable && world.instruction && world.instruction.ackRequired && !world.instruction.acknowledgedAt ? item("ack", false, "Pending", "instruction", "Read the office instruction", world.instruction.title + ". " + world.instruction.body, "Supervisor", "An acknowledgement saved for you on this message.") : null,
    () => world.messagesAvailable && world.qa && !world.qa.submittedAt ? item("qa", true, "Pending", "inspect", "Inspect the shop floor", "The office asked you to check " + world.qa.stage.toLowerCase() + ". Sending the result does not lift a stop or approve money.", "Supervisor", "A submission saved on this inspection request.") : null,
    () => world.openSnags ? item("snags", false, "Pending", "snags", "Look at open snags", "A snag is still open on this site.", "Supervisor, then the assigned gang", "The snag closed through the existing reinspection.") : null,
    () => world.inspectionsDue ? item("due", true, "Blocked", "inspect", "Inspect the shop floor", "A required check is still outstanding. Work stays blocked until the result is saved.", "Supervisor", "The required inspection saved.") : null,
  ];
  const open = rules.map(rule => rule()).filter(Boolean);
  if (!open.length) open.push(item("monitor", false, "Pending", "people", "Keep today’s record current", "Everyone booked is accounted for. Record arrivals and leaving times as they happen.", "Supervisor", "Attendance saved as people come and go."));
  return open;
  function item(id, gate, kind, to, label, detail, who, proof) {
    return { id, gate, kind, to, label, what: label, detail, who, proof, job };
  }
}
function officeQueue() {
  const job = jobName();
  const rows = [];
  if (world.restrictionsAvailable && world.safety) rows.push(task("safety", "office", true, "hold", "Review the safety stop", "An authorised office user", "A release saved on that hold.", "The supervisor keeps the work stopped. Today does not release it."));
  if (world.restrictionsAvailable && world.release) rows.push(task("release", "office", true, "hold", "Review the request to restart", "The office user allowed to release", "The existing release decision, with a note.", "A request is not a release."));
  if (world.restrictionsAvailable && world.qualityHold) rows.push(task("quality", "office", true, "hold", "Review the quality hold", "An authorised office user", "A release saved on that hold.", "Tiling stays held until that release."));
  if (world.locations === 0) rows.push(task("locations", "office", false, "job", "Add the locations", "Office", "At least one location saved on this job.", "No location is saved yet. Labour cannot be booked until one is."));
  if (world.provisional) rows.push(task("provisional", "office", false, "confirm", "Confirm the person added on site", "Office", "That person’s status saved as active.", "They stay provisional until this is saved."));
  if (world.messagesAvailable && world.qa && !world.qa.submittedAt) rows.push(task("qa", "supervisor", false, "request", "Inspect the shop floor and send the result", "Supervisor", "A submission saved on this inspection request.", "Waiting on the supervisor. The office cannot send the result."));
  if (world.messagesAvailable && world.instruction && world.instruction.ackRequired && !world.instruction.acknowledgedAt) rows.push(task("ack", "supervisor", false, "instruction", "Read the instruction and acknowledge it", "Supervisor", "An acknowledgement saved by that supervisor on this message.", "Waiting on the supervisor. There is no read receipt."));
  if (world.insuranceDays <= 30) rows.push(task("insurance", "office", false, "labour", "Record the public liability certificate", "Office", "An insurance row that still covers the booking.", "Cover is inside 30 days. This does not stop the job."));
  if (world.enquiry) rows.push(task("enquiry", "office", false, "money", "Read the enquiry", "Office", "A job record, if you create one. There is no Declined status.", "Received. Reading it does not create a job."));
  return rows;
  function task(id, actor, gate, to, what, who, proof, detail) {
    return { id, actor, gate, waiting: actor !== "office", to, what, label: what, who, proof, detail, job, kind: gate ? "Blocked" : actor === "office" ? "Pending" : "Waiting" };
  }
}
function subQueue() {
  const job = jobName();
  const rows = [];
  if (world.snagAssigned && !world.snagSubmitted) rows.push({ id: "snag", gate: true, kind: "Pending", to: "snag", label: "Send photos of the lippage repair", what: "Send photos of the lippage repair", detail: "This snag is assigned to your gang. Sending it does not close the snag.", who: "Subcontractor", proof: "A repair submission saved on this snag.", job });
  if (world.hasPackage && !world.drawing) rows.push({ id: "drawing", gate: false, kind: "Pending", to: "papers", label: "Open the papers for your area", what: "No drawing is saved on your area", detail: "Ask the supervisor on site. There is no message inbox on this login.", who: "Office uploads the drawing", proof: "An operational drawing saved on your area.", job });
  return rows;
}

function taskList(items, labelFor) {
  if (!items.length) return txt("p", "muted", "Nothing else is open.");
  return el("ul", { class: "list" }, items.map(item => el("li", { class: "item" }, [
    tag(item.kind),
    el("strong", { text: item.what || item.label }),
    el("span", { text: "Job: " + item.job }),
    el("span", { text: "Who: " + item.who }),
    el("span", { text: "Done when: " + item.proof }),
    button("quiet", labelFor(item), go(item.to)),
  ])));
}
function primaryFor(item) {
  if (!item) return [txt("p", "lead", "Nothing needs you right now.")];
  return [el("div", { class: "next" }, [tag(item.kind), button("primary", item.label, go(item.to)), txt("p", "muted", item.detail || item.proof)])];
}
function evidence() {
  const blocks = [txt("h2", "", "What the site has saved")];
  if (!world.messagesAvailable) {
    blocks.push(el("div", { class: "alert" }, [el("strong", { text: "Messages could not be read" }), txt("p", "", "Nothing is marked done. Ask the supervisor directly if you were expecting a reply.")]));
    return blocks;
